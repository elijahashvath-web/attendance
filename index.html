<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Attendance</title>
  <style>
    :root {
      --bg: #f2f2f7; --card: #ffffff; --label: #000000; --label2: rgba(60,60,67,.6);
      --sep: rgba(60,60,67,.18); --blue: #007aff; --green: #34c759; --red: #ff3b30; --fill: rgba(120,120,128,.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: #1c1c1e; --label: #ffffff; --label2: rgba(235,235,245,.6);
        --sep: rgba(84,84,88,.6); --blue: #0a84ff; --green: #30d158; --red: #ff453a; --fill: rgba(120,120,128,.24);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--label); min-height: 100vh; min-height: 100dvh;
           font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, Arial, sans-serif;
           padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .wrap { width: 100%; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: .37px; margin: 8px 0 2px; }
    #today { color: var(--label2); font-size: 15px; margin-bottom: 20px; }

    .group { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
    .header { font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 0 16px 6px; letter-spacing: -.08px; }

    .pick { display: flex; align-items: center; padding: 6px 8px 6px 16px; }
    .pick span { font-size: 17px; flex: 0 0 auto; }
    select { flex: 1; font: inherit; font-size: 17px; color: var(--blue); background: transparent; border: 0;
             text-align: right; text-align-last: right; padding: 10px 8px; -webkit-appearance: none; appearance: none; }
    select:disabled { color: var(--label2); }

    .hero { text-align: center; padding: 22px 16px 24px; }
    #wk { font-size: 34px; font-weight: 700; letter-spacing: .37px; }
    #full { font-size: 17px; color: var(--label2); margin-top: 2px; }
    #tag { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 999px; font-size: 13px;
           font-weight: 600; color: #fff; background: var(--blue); visibility: hidden; }
    #tag.show { visibility: visible; }

    .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 14px 16px; }
    .prog { flex-basis: 100%; margin-top: 12px; padding: 10px 12px; background: var(--fill); border-radius: 10px;
            font-size: 15px; line-height: 1.35; white-space: pre-line; }
    .prog div + div { margin-top: 6px; padding-top: 6px; border-top: .5px solid var(--sep); }
    .prog.empty { color: var(--label2); }
    .row + .row { border-top: .5px solid var(--sep); margin-left: 16px; padding-left: 0; }
    .row .t { font-size: 17px; font-weight: 600; }
    .row .s { font-size: 13px; color: var(--label2); margin-top: 2px; }
    .row.done .s { color: var(--green); }
    button { font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: var(--blue); border: 0;
             border-radius: 999px; padding: 9px 18px; min-width: 112px; transition: transform .1s, opacity .15s; }
    button:active { transform: scale(.96); opacity: .8; }
    button.done { background: var(--fill); color: var(--green); }
    button:disabled { opacity: .35; }

    #sync { color: var(--label2); font-size: 12px; margin: -14px 0 18px; min-height: 15px; }
    #gate { padding: 16px; display: none; }
    #gate #urlBox { display: none; }
    #gate select { display: block; width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; margin: 10px 0 12px; border-radius: 10px;
                  border: .5px solid var(--sep); background: var(--fill); color: var(--label); text-align: left; text-align-last: left; }
    #me { color: var(--label2); font-size: 13px; margin: -12px 0 16px; }
    #me a { color: var(--blue); cursor: pointer; }
    #msg { text-align: center; font-size: 15px; min-height: 22px; padding: 0 8px; }
    .ok { color: var(--green); } .err { color: var(--red); }
  </style>
</head>
<body>

<div class="wrap">
  <h1>Attendance</h1>
  <div id="today"></div>
  <div id="me"></div>
  <div id="sync"></div>

  <div class="group" id="gate">
    <div style="font-size:17px;font-weight:600">Who are you?</div>
    <div style="font-size:13px;color:var(--label2);margin-top:2px">Pick your name once. It is saved on this device.</div>
    <select id="whoSel"></select>
    <button onclick="saveWho()">Continue</button>
  </div>

  <div class="header">Date</div>
  <div class="group">
    <label class="pick"><span>Select</span><select id="dateSel" disabled></select></label>
  </div>

  <div class="group hero">
    <div id="wk"></div>
    <div id="full"></div>
    <div id="tag">Today</div>
  </div>

  <div class="header">Sessions</div>
  <div class="group">
    <div class="row" id="rowAm">
      <div><div class="t">Morning</div><div class="s"></div></div>
      <button id="am" onclick="go('AM')" disabled>Mark AM</button>
      <div class="prog" id="progAm"></div>
    </div>
    <div class="row" id="rowPm">
      <div><div class="t">Afternoon</div><div class="s"></div></div>
      <button id="pm" onclick="go('PM')" disabled>Mark PM</button>
      <div class="prog" id="progPm"></div>
    </div>
  </div>

  <div id="msg"></div>
</div>

<script>
  // ====== SETTINGS ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbwXvWDDKwDTU7cQlxGDmiecLFcD-P5OoD0vifQbD8v6nukyTnZvDna8i2xsCvpb-f-8/exec';
  const TZ = 'Asia/Singapore';
  // ======================
  const LS_WHO = 'att_who', LS_CACHE = 'att_cache', LS_SEL = 'att_sel', LS_TEAM = 'att_team';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  let data = [], todayDate = '', selLabel = null, busy = false;

  const $ = id => document.getElementById(id);
  function todayYmd() { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date()); }
  function todayText() {
    return new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
      .format(new Date()).replace(/^(\w+) /, '$1, ');
  }
  function saveCache(serverToday) {
    store.set(LS_CACHE, JSON.stringify({ who: store.get(LS_WHO), dates: data, serverToday: serverToday || '', savedAt: Date.now() }));
  }
  function setSync(t) { $('sync').textContent = t; }
  function clock() { return new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date()); }

  function applyData(list, serverToday) {
    data = list;
    const hit = data.find(d => d.ymd && d.ymd === todayYmd());
    todayDate = hit ? hit.label : (serverToday || '');
    $('today').textContent = 'Today · ' + todayText();
    const sel = $('dateSel');
    const keep = selLabel || store.get(LS_SEL);
    sel.innerHTML = '';
    data.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = i;
      const wd = d.weekday ? d.weekday.slice(0, 3) + ', ' : '';
      o.textContent = wd + d.label + (d.label === todayDate ? ' (today)' : '');
      sel.appendChild(o);
    });
    let idx = data.findIndex(d => d.label === todayDate);
    if (idx < 0) idx = data.findIndex(d => d.label === keep);
    if (idx < 0) idx = 0;
    sel.value = idx;
    sel.disabled = !data.length;
    selLabel = data[idx] ? data[idx].label : null;
    if (!todayDate) showMsg('Today’s date isn’t in the sheet. Pick a date from the list.', false);
    render();
  }

  function api(action, params) {
    const q = new URLSearchParams(Object.assign({ action: action, who: store.get(LS_WHO) || '' }, params || {}));
    return fetch(API_URL + '?' + q.toString()).then(r => r.json());
  }

  function showMe() {
    const who = store.get(LS_WHO);
    const m = $('me');
    m.textContent = '';
    if (!who) return;
    m.appendChild(document.createTextNode('Marking for ' + who + ' · '));
    const a = document.createElement('a'); a.textContent = 'Not you?'; a.onclick = switchPerson;
    m.appendChild(a);
  }

  function switchPerson() {
    store.del(LS_WHO); store.del(LS_CACHE);
    data = []; selLabel = null;
    $('dateSel').innerHTML = ''; $('dateSel').disabled = true;
    ['wk', 'full', 'sync', 'msg'].forEach(i => $(i).textContent = '');
    $('tag').classList.remove('show');
    showMe();
    askWho();
  }

  // ----- first-time name picker -----
  function fillTeam(names) {
    const sel = $('whoSel');
    sel.innerHTML = '';
    const ph = document.createElement('option'); ph.value = ''; ph.textContent = 'Choose your name'; sel.appendChild(ph);
    names.slice().sort((x, y) => x.localeCompare(y)).forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
  }
  function askWho() {
    $('gate').style.display = 'block';
    $('today').textContent = 'Today · ' + todayText();
    let cached = null;
    try { cached = JSON.parse(store.get(LS_TEAM) || 'null'); } catch (e) {}
    if (cached && cached.length) fillTeam(cached);
    setSync('Loading names…');
    api('team').then(r => {
      if (!r.ok) { showMsg(r.message, false); setSync(''); return; }
      store.set(LS_TEAM, JSON.stringify(r.names));
      fillTeam(r.names);
      setSync('');
    }).catch(e => setSync('Could not reach the sheet' + (e && e.message ? ' (' + e.message + ')' : '')));
  }
  function saveWho() {
    const v = $('whoSel').value;
    if (!v) return;
    store.set(LS_WHO, v);
    $('gate').style.display = 'none';
    showMsg('', true);
    showMe();
    refresh();
  }

  function refresh() {
    if (!store.get(LS_WHO)) { askWho(); return; }
    setSync(data.length ? 'Updating…' : 'Loading…');
    api('data').then(r => {
      if (r.unknownName) { store.del(LS_WHO); store.del(LS_CACHE); showMe(); askWho(); showMsg('Your name is no longer on the list. Pick it again.', false); return; }
      if (!r.ok) { showMsg(r.message, false); setSync(data.length ? 'Showing saved data' : ''); return; }
      applyData(r.dates, r.todayDate);
      saveCache(r.todayDate);
      setSync('Updated ' + clock());
    }).catch(e => { const why = e && e.message ? ' (' + e.message + ')' : ''; setSync(data.length ? 'Offline · showing saved data' + why : 'Could not reach the sheet' + why); });
  }

  function current() { return data[$('dateSel').value]; }
  function onPick() { const d = current(); if (d) { selLabel = d.label; store.set(LS_SEL, d.label); } render(); }

  function render() {
    const d = current();
    if (!d) return;
    $('wk').textContent = d.weekday || d.label;
    $('full').textContent = d.full || d.label;
    $('tag').classList.toggle('show', d.label === todayDate);
    setBtn('am', 'rowAm', d.hasAm, d.amStatus, 'AM');
    setBtn('pm', 'rowPm', d.hasPm, d.pmStatus, 'PM');
    setProg('progAm', d.hasAm, d.amProgram);
    setProg('progPm', d.hasPm, d.pmProgram);
  }

  function setProg(id, exists, lines) {
    const p = $(id);
    p.innerHTML = '';
    p.style.display = exists ? '' : 'none';
    p.classList.toggle('empty', !lines || !lines.length);
    if (!lines || !lines.length) { p.textContent = 'No program listed'; return; }
    lines.forEach(t => { const x = document.createElement('div'); x.textContent = t; p.appendChild(x); });
  }

  function setBtn(id, rowId, exists, status, name) {
    const b = $(id), row = $(rowId);
    const done = status === 'Attended';
    b.disabled = !exists || busy;
    b.classList.toggle('done', done);
    row.classList.toggle('done', done);
    b.textContent = done ? '✓ Attended' : 'Mark ' + name;
    row.querySelector('.s').textContent = exists ? (status ? status : 'Not marked yet') : 'No column in sheet';
  }

  function showMsg(text, ok) { const m = $('msg'); m.className = ok ? 'ok' : 'err'; m.textContent = text; }

  function go(session) {
    const d = current();
    if (!d) return;
    const key = session === 'AM' ? 'amStatus' : 'pmStatus';
    const before = d[key];
    d[key] = 'Attended';                       // show it instantly; undo below if the sheet says no
    busy = true; showMsg('Saving…', true); $('msg').className = ''; render();
    const undo = msg => { d[key] = before; busy = false; showMsg(msg, false); render(); saveCache(); };
    api('mark', { date: d.label, session: session }).then(r => {
      if (r.unknownName) { undo('Your name is no longer on the list.'); switchPerson(); return; }
      if (!r.ok) { undo(r.message); return; }
      busy = false; showMsg(r.message, true); render(); saveCache();
    }).catch(e => undo('Could not reach the sheet. Nothing was saved.' + (e && e.message ? ' (' + e.message + ')' : '')));
  }

  $('dateSel').onchange = onPick;

  // Open instantly from the last saved copy, then refresh in the background.
  (function start() {
    showMe();
    try {
      const c = JSON.parse(store.get(LS_CACHE) || 'null');
      if (c && c.who === store.get(LS_WHO) && c.dates && c.dates.length) { applyData(c.dates, c.serverToday); setSync('Saved copy · updating…'); }
      else $('today').textContent = 'Today · ' + todayText();
    } catch (e) {}
    refresh();
  })();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && store.get(LS_WHO)) refresh(); });
</script>
</body>
</html>
